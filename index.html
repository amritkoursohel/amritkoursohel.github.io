    <script>
      try {
        localStorage.removeItem('theme');
        const theme = localStorage.getItem('portfolio_user_theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        document.documentElement.classList.remove('dark');
      }
    </script>
